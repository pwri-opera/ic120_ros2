ekf_global:
    ros__parameters:
        # for wheel and imu fusion
        use_sim_time: true
        debug: false
        frequency: 10.0
        predict_to_current_time: true
        reset_on_time_jump: true
        transform_time_offset: 0.0
        transform_timeout: 0.0
        print_diagnostics: true
        publish_acceleration: true
        publish_tf: true
        two_d_mode: true

        map_frame: map
        odom_frame: ic120_tf/odom
        base_link_frame: ic120_tf/base_link
        world_frame: map


        # Wheel-derived body velocity. Do not also fuse its integrated pose:
        # map->odom is computed by this filter, and transforming that absolute
        # odom pose back through map->odom feeds the estimate into itself.
        odom0: odom0
        odom0_queue_size: 1
        odom0_config: [false, false, false,
                    false, false, false,
                    true, false, false,
                    false, false, true,
                    false, false, false]
        odom0_differential: false

        # Simulator global position and orientation are the absolute reference.
        odom1: odom1
        odom1_queue_size: 1
        odom1_config: [true, true, true,
                    false, false, true,
                    false , false, false,
                    false, false, false,
                    false, false, false]
        odom1_differential: false
